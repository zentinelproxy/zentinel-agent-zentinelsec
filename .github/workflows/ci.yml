name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Stock OWASP CRS used by the tests and the smoke test (the commit
  # zentinel-modsec's CI pins).
  CRS_COMMIT: 30cb436b261a9f5ec32a5a0677e17f3cfa1a8739

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      - uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The CRS integration tests fail loudly without this checkout rather than
      # skipping, so that they cannot silently stop running again.
      - name: Fetch OWASP CRS
        run: |
          set -euo pipefail
          git init -q test-rules/crs
          git -C test-rules/crs fetch -q --depth 1 https://github.com/coreruleset/coreruleset.git "$CRS_COMMIT"
          git -C test-rules/crs checkout -q FETCH_HEAD
          cp test-rules/crs/crs-setup.conf.example test-rules/crs/crs-setup.conf
      - run: cargo test --workspace

  # Runs the release binary with stock CRS behind a real Zentinel and checks
  # the v2 handshake, an allowed request and blocked attacks. Same script as
  # the release workflow, so a change that would break a release fails here.
  smoke:
    name: Smoke test behind Zentinel
    runs-on: ubuntu-latest
    env:
      ZENTINEL_RELEASE: "26.10_7"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-smoke-
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo build --release --locked
      - name: Fetch OWASP CRS
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/crs"
          git -C "$RUNNER_TEMP/crs" fetch -q --depth 1 https://github.com/coreruleset/coreruleset.git "$CRS_COMMIT"
          git -C "$RUNNER_TEMP/crs" checkout -q FETCH_HEAD
      - name: Download Zentinel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="zentinel-${ZENTINEL_RELEASE}-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/zentinel" && cd "$RUNNER_TEMP/zentinel"
          gh release download "$ZENTINEL_RELEASE" --repo zentinelproxy/zentinel \
            --pattern "$asset" --pattern "$asset.sha256"
          shasum -a 256 -c "$asset.sha256"
          tar xzf "$asset"
      - run: CRS_DIR="$RUNNER_TEMP/crs" scripts/smoke-test.sh target/release/zentinel-zentinelsec-agent "$RUNNER_TEMP/zentinel/zentinel"

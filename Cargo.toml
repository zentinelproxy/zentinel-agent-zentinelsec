[package]
name = "zentinel-agent-zentinelsec"
version = "0.4.1"
edition = "2021"
rust-version = "1.94.1"
authors = ["Zentinel Contributors"]
license = "Apache-2.0"
repository = "https://github.com/zentinelproxy/zentinel-agent-zentinelsec"
homepage = "https://zentinelproxy.io"
documentation = "https://zentinelproxy.io/docs/agents/zentinelsec"
description = "Pure Rust ModSecurity-compatible WAF agent for Zentinel - loads the stock OWASP CRS without C dependencies"
keywords = ["zentinel", "proxy", "agent", "waf", "modsecurity"]
categories = ["network-programming"]
readme = "README.md"

[lib]
name = "zentinel_agent_zentinelsec"
path = "src/lib.rs"

[[bin]]
name = "zentinel-zentinelsec-agent"
path = "src/main.rs"

[dependencies]
# Zentinel protocol
zentinel-agent-protocol = "0.6.50"
zentinel-common = "0.6.50"

# Pure Rust ModSecurity implementation
# >= 0.5.0 required. 0.4.0 kept only the last setvar of a rule, so CRS anomaly
# scores were dropped and some detected attacks passed (zentinel-modsec#47).
# 0.3.0 and earlier deny every request under stock CRS (zentinel-modsec#29).
zentinel-modsec = "0.5.0"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Glob pattern matching for rule files
glob = "0.3"

# Base64 decoding for body chunks
base64 = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Command line
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.12"
uuid = { version = "1.10", features = ["v4"] }
